[project]
name = "darkroom_blend"
version = "0.1.0"
description = "Develop your digital photos in Blender"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fake-bpy-module>=20251003",
]

[dependency-groups]
dev = [
    "python-lsp-server>=1.13.1",
    "ruff>=0.14.0",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tool.pixi.dependencies]
# Match the Python version bundled with Blender
python = "3.13.*"
# oiiotool CLI + Python bindings, used by the scripts in tools/
openimageio = "*"
py-openimageio = "*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
lint = "ruff check src tools"
format = "ruff format src tools"
raw-to-exr = "python tools/raw-to-ap0-exr.py"
copy-metadata = "python tools/copy-metadata.py"
merge-gainmap = "python tools/merge-gainmap.py"

[tool.ruff]
# Same as Black.
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W", "C", "I"]
ignore = [
    # Info: Use `isinstance()` instead of comparing types directly.
    # Why disable? Changes code logic, in rare cases we want to compare exact types.
    "E721",
    # Info: Fix bare except.
    # Why disable? Disruptive, leave our exceptions alone.
    "E722",
    # Info: Fix module level import not at top of file.
    # Why disable? Re-ordering imports is disruptive and breaks some scripts
    # that need to check if a module has already been loaded in the case of reloading.
    "E402",
]
